<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YESHUA|JESUS|ADONAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #f1c40f;
            --gold-bright: #ffe066;
            --dark: #0f172a;
            --glass: rgba(15, 23, 42, 0.88);
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; 
        }

        html, body { 
            width: 100%; 
            height: 100%; 
            font-family: 'Inter', sans-serif; 
            background: var(--dark); 
            color: white; 
            overflow: hidden; 
            overscroll-behavior: none; 
        }

        /* CIRCULAR NAV HUB */
        #hub-container {
            position: fixed; 
            inset: 0; 
            z-index: 9999;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center;
            padding: clamp(15px, 3vh, 35px) 15px;
            transition: opacity 0.4s ease, transform 0.4s ease;
            will-change: opacity, transform;
        }

        #hub-container.hidden {
            opacity: 0; 
            pointer-events: none; 
            transform: scale(1.08);
        }

        /* LOGO & TITLE HEADER SECTION */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(4px, 1.2vh, 10px);
            z-index: 10;
            user-select: none;
            width: 100%;
        }

        /* EMBLEM / LOGO STYLING */
        .brand-logo-wrapper {
            position: relative;
            width: clamp(110px, 20vmin, 165px);
            height: clamp(110px, 20vmin, 165px);
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 18px rgba(241, 196, 15, 0.45));
        }

        .brand-logo-svg {
            width: 100%;
            height: 100%;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 8px rgba(241, 196, 15, 0.35)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 25px rgba(241, 196, 15, 0.75)); transform: scale(1.03); }
        }

        .hub-title {
            font-family: 'Cinzel', serif; 
            font-size: clamp(1.2rem, 3.8vw, 2.6rem);
            font-weight: 900;
            color: var(--gold); 
            text-align: center; 
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
            line-height: 1.15;
            letter-spacing: 0.05em;
        }

        .tagline-banner {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.5rem, 1.2vw, 0.8rem);
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-align: center;
            font-weight: 700;
            border-top: 1px solid rgba(241, 196, 15, 0.35);
            border-bottom: 1px solid rgba(241, 196, 15, 0.35);
            padding: 4px 10px;
            margin-top: 2px;
        }

        /* RESPONSIVE MENU RING */
        .circle-menu-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .circle-menu {
            position: relative; 
            width: min(78vw, 62vh);
            height: min(78vw, 62vh);
            min-width: 290px;
            min-height: 290px;
            max-width: 580px;
            max-height: 580px;
            border-radius: 50%; 
            border: 3px dashed rgba(241, 196, 15, 0.4);
            display: flex; 
            justify-content: center; 
            align-items: center;
            animation: rotateOrbit 60s linear infinite;
            will-change: transform;
        }

        .circle-menu.paused { 
            animation-play-state: paused !important; 
        }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ENLARGED CENTER NODE */
        .center-node {
            position: absolute; 
            width: clamp(95px, 20vmin, 150px); 
            height: clamp(95px, 20vmin, 150px); 
            border-radius: 50%;
            background: var(--gold); 
            color: var(--dark); 
            font-family: 'Cinzel', serif;
            font-weight: 800; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            text-align: center; 
            box-shadow: 0 0 50px rgba(241, 196, 15, 0.5);
            cursor: pointer; 
            z-index: 10; 
            font-size: clamp(0.95rem, 2.8vmin, 1.4rem);
            padding: 10px;
            user-select: none;
            letter-spacing: 0.05em;
        }

        /* ENLARGED APP NODES */
        .app-node {
            position: absolute; 
            width: clamp(75px, 16vmin, 130px); 
            height: clamp(75px, 16vmin, 130px);
            border-radius: 50%; 
            background: var(--glass); 
            border: 2.5px solid var(--gold);
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            text-align: center;
            cursor: pointer; 
            transition: var(--transition); 
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            padding: 8px;
            transform-origin: center center;
            transform: translate(-50%, -50%);
            user-select: none;
            will-change: transform;
        }

        .app-node:active, .app-node.active-touch {
            transform: translate(-50%, -50%) scale(1.15) !important; 
            background: var(--gold); 
            color: var(--dark);
            box-shadow: 0 0 35px var(--gold);
            z-index: 20;
        }

        /* BOOSTED TYPOGRAPHY */
        .app-node span { 
            font-size: clamp(0.6rem, 1.4vmin, 0.85rem); 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-top: 4px; 
            line-height: 1.1;
            letter-spacing: 0.03em;
        }

        .app-node .content {
            animation: counterRotate 60s linear infinite;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none;
            will-change: transform;
        }

        .circle-menu.paused .app-node .content { 
            animation-play-state: paused !important; 
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* VIEWPORT CONTAINERS (IFRAMES) */
        .app-frame {
            position: fixed; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            border: none;
            z-index: 100; 
            display: none; 
            background: var(--dark);
        }

        .app-frame.active { display: block; }

        /* FLOATING HUB BUTTON */
        #floating-hub-btn {
            position: fixed; 
            top: env(safe-area-inset-top, 20px); 
            left: 20px; 
            z-index: 10000;
            background: var(--gold); 
            color: var(--dark); 
            border: none;
            padding: 14px 28px; 
            border-radius: 50px; 
            font-weight: 800;
            cursor: pointer; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none; 
            text-transform: uppercase; 
            font-size: 0.85rem;
            transition: var(--transition);
            min-height: 48px;
        }

        #floating-hub-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- CIRCULAR HUB CONTROLLER -->
    <div id="hub-container">
        
        <!-- HEADER WITH HOLY SPIRIT LOGO & FULL SLOGAN -->
        <header class="brand-header">
            <div class="brand-logo-wrapper">
                <svg class="brand-logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Circular Text Path -->
                    <path id="textCircle" d="M 100, 100 m -78, 0 a 78,78 0 1,1 156,0 a 78,78 0 1,1 -156,0" fill="none"/>
                    
                    <!-- Decorative Golden Rings -->
                    <circle cx="100" cy="100" r="96" stroke="#f1c40f" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
                    <circle cx="100" cy="100" r="87" stroke="#f1c40f" stroke-width="1.5" opacity="0.85"/>
                    <circle cx="100" cy="100" r="67" stroke="#f1c40f" stroke-width="2"/>
                    
                    <!-- Circular Slogan Arc -->
                    <text font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#f1c40f" letter-spacing="1.4">
                        <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
                            WE ROAR • WE INTERCEDE • WE SOAR • WE GROAN • WE PRAY • WE TEACH WORD
                        </textPath>
                    </text>
                    
                    <!-- Holy Spirit Ascending Light Rays & Flames -->
                    <g opacity="0.85">
                        <line x1="100" y1="35" x2="100" y2="48" stroke="#f1c40f" stroke-width="2"/>
                        <line x1="60" y1="50" x2="70" y2="58" stroke="#f1c40f" stroke-width="1.5"/>
                        <line x1="140" y1="50" x2="130" y2="58" stroke="#f1c40f" stroke-width="1.5"/>
                        <line x1="42" y1="80" x2="54" y2="84" stroke="#f1c40f" stroke-width="1.5"/>
                        <line x1="158" y1="80" x2="146" y2="84" stroke="#f1c40f" stroke-width="1.5"/>
                    </g>
                    
                    <!-- Holy Spirit Dove Silhouette (Center Motif) -->
                    <g transform="translate(100, 96) scale(0.85)">
                        <!-- Outer Holy Spirit Fire Glow -->
                        <path d="M0 -32 C-12 -22, -28 -12, -44 -14 C-26 2, -14 10, -8 24 C-4 12, 4 12, 8 24 C14 10, 26 2, 44 -14 C28 -12, 12 -22, 0 -32 Z" fill="#f1c40f" opacity="0.25"/>
                        
                        <!-- Main Dove Body -->
                        <path d="M0 -26 C-9 -18, -22 -8, -36 -10 C-20 2, -10 8, -5 20 C-3 10, 3 10, 5 20 C10 8, 20 2, 36 -10 C22 -8, 9 -18, 0 -26 Z" fill="#f1c40f"/>
                        <!-- Dove Head & Descending Beak -->
                        <circle cx="0" cy="-24" r="5.5" fill="#f1c40f"/>
                        <path d="M0 -18 L-2 -12 L2 -12 Z" fill="#0f172a"/>
                        
                        <!-- Open Word Bible Base -->
                        <path d="M-22 24 Q0 18 0 28 Q0 18 22 24 L20 34 Q0 28 0 36 Q0 28 -20 34 Z" fill="#f1c40f"/>
                        <path d="M-18 26 Q0 21 0 29 M0 29 Q0 21 18 26" stroke="#0f172a" stroke-width="1.5" fill="none"/>
                    </g>
                    
                    <!-- Anointing Oil Drop Emblem Base -->
                    <path d="M100 154 C96 160, 93 163, 93 167 C93 171, 96 174, 100 174 C104 174, 107 171, 107 167 C107 163, 104 160, 100 154 Z" fill="#f1c40f"/>
                </svg>
            </div>
            
            <h1 class="hub-title">INTERNATIONAL INTERCESSORS NETWORK</h1>
            <div class="tagline-banner">We Roar • We Intercede • We Soar • We Groan • We Pray • We Gasp • We Pant • We Teach & Study Word </div>
        </header>
        
        <!-- CIRCULAR NAV WHEEL -->
        <div class="circle-menu-wrapper">
            <div class="circle-menu" id="circleMenu">
                <div class="center-node">HOLY SPIRIT</div>
                
                <div class="app-node" data-app="app-salvation">
                    <div class="content">
                        <div style="font-size: clamp(1.2rem, 3vmin, 2rem);">🌍</div>
                        <span>Salvation</span>
                    </div>
                </div>
                
                <div class="app-node" data-app="app-living-word">
                    <div class="content">
                        <div style="font-size: clamp(1.2rem, 3vmin, 2rem);">📖</div>
                        <span>Living Word</span>
                    </div>
                </div>

                <div class="app-node" data-app="app-kingdom-come">
                    <div class="content">
                        <div style="font-size: clamp(1.2rem, 3vmin, 2rem);">👑</div>
                        <span>Kingdom Come</span>
                    </div>
                </div>

                <div class="app-node" data-app="app-reconciliation">
                    <div class="content">
                        <div style="font-size: clamp(1.2rem, 3vmin, 2rem);">🕊️</div>
                        <span>Reconcile</span>
                    </div>
                </div>

                <div class="app-node" data-app="app-gods-generals">
                    <div class="content">
                        <div style="font-size: clamp(1.2rem, 3vmin, 2rem);">⚔️</div>
                        <span>God's Generals</span>
                    </div>
                </div>

                <div class="app-node" data-app="app-bible-teaching">
                    <div class="content">
                        <div style="font-size: clamp(1.2rem, 3vmin, 2rem);">📜</div>
                        <span>Bible Teaching</span>
                    </div>
                </div>

                <!-- NEW SERMON EDITOR NODE -->
                <div class="app-node" data-app="app-sermon-editor">
                    <div class="content">
                        <div style="font-size: clamp(1.2rem, 3vmin, 2rem);">✍️</div>
                        <span>Sermon Editor</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FLOATING HOME BUTTON -->
    <button id="floating-hub-btn" onclick="returnToHub()">☰ Hub</button>

    <!-- ISOLATED SCRIPT CONTAINERS -->
    <iframe id="app-salvation" class="app-frame" allow="microphone; geolocation" src="https://jesus-nine-drab.vercel.app"></iframe>
    <iframe id="app-living-word" class="app-frame" allow="microphone" src="https://written-gamma.vercel.app"></iframe>
    <iframe id="app-kingdom-come" class="app-frame" allow="camera; microphone" src="https://ka-ten-rust.vercel.app"></iframe>
    <iframe id="app-reconciliation" class="app-frame" allow="microphone" src="https://reconcile-blond.vercel.app"></iframe>
    <iframe id="app-gods-generals" class="app-frame" allow="microphone" src="https://ochollah.github.io/Genaral"></iframe>
    <iframe id="app-bible-teaching" class="app-frame" allow="microphone" src="https://ochollah.github.io/Word"></iframe>
    <iframe id="app-sermon-editor" class="app-frame" allow="microphone" src="https://sermon-wheat.vercel.app"></iframe>

    <script>
        const menu = document.getElementById('circleMenu');

        function layoutNodes() {
            if (!menu) return;
            const nodes = menu.querySelectorAll('.app-node');
            const total = nodes.length;
            const radius = menu.offsetWidth / 2;

            nodes.forEach((node, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = radius + radius * Math.cos(angle);
                const y = radius + radius * Math.sin(angle);

                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
            });
        }

        // TOUCH & HOVER CONTROLS
        menu.addEventListener('touchstart', () => menu.classList.add('paused'), { passive: true });
        menu.addEventListener('touchend', () => setTimeout(() => menu.classList.remove('paused'), 1200), { passive: true });
        menu.addEventListener('mouseenter', () => menu.classList.add('paused'));
        menu.addEventListener('mouseleave', () => menu.classList.remove('paused'));

        // TAP / CLICK HANDLERS
        document.querySelectorAll('.app-node').forEach(node => {
            const appId = node.getAttribute('data-app');

            node.addEventListener('touchstart', function() {
                this.classList.add('active-touch');
            }, { passive: true });

            node.addEventListener('touchend', function() {
                this.classList.remove('active-touch');
                launchApp(appId);
            });

            node.addEventListener('click', function() {
                launchApp(appId);
            });
        });

        function launchApp(appId) {
            document.getElementById('hub-container').classList.add('hidden');
            document.querySelectorAll('.app-frame').forEach(frame => frame.classList.remove('active'));
            const target = document.getElementById(appId);
            if (target) {
                target.classList.add('active');
                document.getElementById('floating-hub-btn').style.display = 'block';
            }
        }

        function returnToHub() {
            document.querySelectorAll('.app-frame').forEach(frame => frame.classList.remove('active'));
            document.getElementById('hub-container').classList.remove('hidden');
            document.getElementById('floating-hub-btn').style.display = 'none';
        }

        window.addEventListener('load', layoutNodes);
        window.addEventListener('resize', layoutNodes);
        window.addEventListener('orientationchange', layoutNodes);
    </script>
</body>
</html>
