<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YESHUA|JESUS|ADONAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #f1c40f;
            --gold-bright: #ffe066;
            --dark: #0f172a;
            --glass: rgba(15, 23, 42, 0.88);
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; 
        }

        html, body { 
            width: 100%; 
            height: 100%; 
            font-family: 'Inter', sans-serif; 
            background: var(--dark); 
            color: white; 
            overflow: hidden; 
            overscroll-behavior: none; 
        }

        /* CIRCULAR NAV HUB - FULL SCREEN SCROLL SAFE */
        #hub-container {
            position: fixed; 
            inset: 0; 
            z-index: 9999;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center;
            padding: clamp(10px, 2vh, 25px) 15px;
            transition: opacity 0.4s ease, transform 0.4s ease;
            will-change: opacity, transform;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #hub-container.hidden {
            opacity: 0; 
            pointer-events: none; 
            transform: scale(1.05);
        }

        /* LOGO & TITLE HEADER SECTION */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(2px, 1vh, 8px);
            z-index: 10;
            user-select: none;
            width: 100%;
            flex-shrink: 0;
        }

        /* EMBLEM / LOGO STYLING */
        .brand-logo-wrapper {
            position: relative;
            width: clamp(70px, 14vmin, 140px);
            height: clamp(70px, 14vmin, 140px);
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 15px rgba(241, 196, 15, 0.45));
        }

        .brand-logo-svg {
            width: 100%;
            height: 100%;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 8px rgba(241, 196, 15, 0.35)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 25px rgba(241, 196, 15, 0.75)); transform: scale(1.03); }
        }

        .hub-title {
            font-family: 'Cinzel', serif; 
            font-size: clamp(1rem, 3.2vw, 2.2rem);
            font-weight: 900;
            color: var(--gold); 
            text-align: center; 
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
            line-height: 1.1;
            letter-spacing: 0.04em;
        }

        .tagline-banner {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.45rem, 1.1vw, 0.75rem);
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            font-weight: 700;
            border-top: 1px solid rgba(241, 196, 15, 0.35);
            border-bottom: 1px solid rgba(241, 196, 15, 0.35);
            padding: 3px 8px;
            margin-top: 2px;
            max-width: 95%;
        }

        /* RESPONSIVE MENU RING FOR ALL ASPECT RATIOS */
        .circle-menu-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: min(65vw, 52vh);
            margin: 10px 0;
        }

        .circle-menu {
            position: relative; 
            width: min(72vw, 52vh, 480px);
            height: min(72vw, 52vh, 480px);
            min-width: 240px;
            min-height: 240px;
            border-radius: 50%; 
            border: 2px dashed rgba(241, 196, 15, 0.4);
            display: flex; 
            justify-content: center; 
            align-items: center;
            animation: rotateOrbit 60s linear infinite;
            will-change: transform;
        }

        .circle-menu.paused { 
            animation-play-state: paused !important; 
        }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* CENTER NODE */
        .center-node {
            position: absolute; 
            width: clamp(70px, 15vmin, 120px); 
            height: clamp(70px, 15vmin, 120px); 
            border-radius: 50%;
            background: var(--gold); 
            color: var(--dark); 
            font-family: 'Cinzel', serif;
            font-weight: 800; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            text-align: center; 
            box-shadow: 0 0 35px rgba(241, 196, 15, 0.5);
            cursor: pointer; 
            z-index: 10; 
            font-size: clamp(0.75rem, 2.2vmin, 1.1rem);
            padding: 6px;
            user-select: none;
            letter-spacing: 0.04em;
        }

        /* CIRCULAR APP NODES */
        .app-node {
            position: absolute; 
            width: clamp(62px, 12.5vmin, 100px); 
            height: clamp(62px, 12.5vmin, 100px);
            border-radius: 50%; 
            background: var(--glass); 
            border: 2px solid var(--gold);
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            text-align: center;
            cursor: pointer; 
            transition: var(--transition); 
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
            padding: 4px;
            transform-origin: center center;
            transform: translate(-50%, -50%);
            user-select: none;
            will-change: transform;
        }

        .app-node:active, .app-node.active-touch {
            transform: translate(-50%, -50%) scale(1.15) !important; 
            background: var(--gold); 
            color: var(--dark);
            box-shadow: 0 0 25px var(--gold);
            z-index: 20;
        }

        .app-node span { 
            font-size: clamp(0.5rem, 1.1vmin, 0.75rem); 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-top: 2px; 
            line-height: 1.1;
            letter-spacing: 0.02em;
        }

        .app-node .content {
            animation: counterRotate 60s linear infinite;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none;
            will-change: transform;
        }

        .circle-menu.paused .app-node .content { 
            animation-play-state: paused !important; 
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* VIEWPORT CONTAINERS (IFRAMES) */
        .app-frame {
            position: fixed; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            border: none;
            z-index: 100; 
            display: none; 
            background: var(--dark);
        }

        .app-frame.active { display: block; }

        /* DRAGGABLE & COLLAPSIBLE FLOATING HUB CONTROLLER */
        #floating-hub-wrapper {
            position: fixed;
            bottom: env(safe-area-inset-bottom, 20px);
            right: 20px;
            z-index: 10000;
            display: none;
            align-items: center;
            gap: 8px;
            touch-action: none;
            user-select: none;
            transition: opacity 0.2s ease;
        }

        #floating-hub-wrapper.active {
            display: flex;
        }

        .hub-fab-btn {
            background: var(--gold);
            color: var(--dark);
            border: 2px solid var(--gold-bright);
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            text-transform: uppercase;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: var(--transition);
        }

        .hub-fab-toggle {
            width: 38px;
            height: 38px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--gold);
            color: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #floating-hub-wrapper.collapsed .hub-fab-btn {
            display: none;
        }

        /* HORIZONTAL & LANDSCAPE SPECIFIC MEDIA QUERIES */
        @media (max-height: 520px) and (orientation: landscape) {
            #hub-container {
                flex-direction: row;
                justify-content: space-around;
                padding: 10px 20px;
            }
            .brand-header {
                width: 35%;
                max-width: 280px;
            }
            .circle-menu-wrapper {
                width: 60%;
                min-height: 100%;
            }
            .circle-menu {
                width: min(85vh, 320px);
                height: min(85vh, 320px);
            }
        }
    </style>
</head>
<body>

    <!-- CIRCULAR HUB CONTROLLER -->
    <div id="hub-container">
        
        <!-- HEADER WITH HOLY SPIRIT LOGO & FULL SLOGAN -->
        <header class="brand-header">
            <div class="brand-logo-wrapper">
                <svg class="brand-logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path id="textCircle" d="M 100, 100 m -78, 0 a 78,78 0 1,1 156,0 a 78,78 0 1,1 -156,0" fill="none"/>
                    <circle cx="100" cy="100" r="96" stroke="#f1c40f" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
                    <circle cx="100" cy="100" r="87" stroke="#f1c40f" stroke-width="1.5" opacity="0.85"/>
                    <circle cx="100" cy="100" r="67" stroke="#f1c40f" stroke-width="2"/>
                    
                    <text font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#f1c40f" letter-spacing="1.4">
                        <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
                            WE ROAR • WE INTERCEDE • WE SOAR • WE GROAN • WE PRAY • WE TEACH WORD
                        </textPath>
                    </text>
                    
                    <g opacity="0.85">
                        <line x1="100" y1="35" x2="100" y2="48" stroke="#f1c40f" stroke-width="2"/>
                        <line x1="60" y1="50" x2="70" y2="58" stroke="#f1c40f" stroke-width="1.5"/>
                        <line x1="140" y1="50" x2="130" y2="58" stroke="#f1c40f" stroke-width="1.5"/>
                        <line x1="42" y1="80" x2="54" y2="84" stroke="#f1c40f" stroke-width="1.5"/>
                        <line x1="158" y1="80" x2="146" y2="84" stroke="#f1c40f" stroke-width="1.5"/>
                    </g>
                    
                    <g transform="translate(100, 96) scale(0.85)">
                        <path d="M0 -32 C-12 -22, -28 -12, -44 -14 C-26 2, -14 10, -8 24 C-4 12, 4 12, 8 24 C14 10, 26 2, 44 -14 C28 -12, 12 -22, 0 -32 Z" fill="#f1c40f" opacity="0.25"/>
                        <path d="M0 -26 C-9 -18, -22 -8, -36 -10 C-20 2, -10 8, -5 20 C-3 10, 3 10, 5 20 C10 8, 20 2, 36 -10 C22 -8, 9 -18, 0 -26 Z" fill="#f1c40f"/>
                        <circle cx="0" cy="-24" r="5.5" fill="#f1c40f"/>
                        <path d="M0 -18 L-2 -12 L2 -12 Z" fill="#0f172a"/>
                        <path d="M-22 24 Q0 18 0 28 Q0 18 22 24 L20 34 Q0 28 0 36 Q0 28 -20 34 Z" fill="#f1c40f"/>
                        <path d="M-18 26 Q0 21 0 29 M0 29 Q0 21 18 26" stroke="#0f172a" stroke-width="1.5" fill="none"/>
                    </g>
                    
                    <path d="M100 154 C96 160, 93 163, 93 167 C93 171, 96 174, 100 174 C104 174, 107 171, 107 167 C107 163, 104 160, 100 154 Z" fill="#f1c40f"/>
                </svg>
            </div>
            
            <h1 class="hub-title">INTERNATIONAL INTERCESSORS NETWORK</h1>
            <div class="tagline-banner">We Roar • We Intercede • We Soar • We Groan • We Pray • We Gasp • We Pant • We Teach & Study Word</div>
        </header>
        
        <!-- CIRCULAR NAV WHEEL -->
        <div class="circle-menu-wrapper">
            <div class="circle-menu" id="circleMenu">
                <div class="center-node">HOLY SPIRIT</div>
                
                <div class="app-node" data-app="app-salvation">
                    <div class="content">
                        <div style="font-size: clamp(1rem, 2.5vmin, 1.6rem);">🌍</div>
                        <span>Salvation</span>
                    </div>
                </div>
                
                <div class="app-node" data-app="app-living-word">
                    <div class="content">
                        <div style="font-size: clamp(1rem, 2.5vmin, 1.6rem);">📖</div>
                        <span>Living Word</span>
                    </div>
                </div>

                <div class="app-node" data-app="app-kingdom-come">
                    <div class="content">
                        <div style="font-size: clamp(1rem, 2.5vmin, 1.6rem);">👑</div>
                        <span>Kingdom Come</span>
                    </div>
                </div>

                <div class="app-node" data-app="app-reconciliation">
                    <div class="content">
                        <div style="font-size: clamp(1rem, 2.5vmin, 1.6rem);">🕊️</div>
                        <span>Reconcile</span>
                    </div>
                </div>

                <div class="app-node" data-app="app-gods-generals">
                    <div class="content">
                        <div style="font-size: clamp(1rem, 2.5vmin, 1.6rem);">⚔️</div>
                        <span>God's Generals</span>
                    </div>
                </div>

                <div class="app-node" data-app="app-bible-teaching">
                    <div class="content">
                        <div style="font-size: clamp(1rem, 2.5vmin, 1.6rem);">📜</div>
                        <span>Bible Teaching</span>
                    </div>
                </div>

                <div class="app-node" data-app="app-sermon-editor">
                    <div class="content">
                        <div style="font-size: clamp(1rem, 2.5vmin, 1.6rem);">✍️</div>
                        <span>Sermon Editor</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- DRAGGABLE & COLLAPSIBLE FLOATING HOME BUTTON -->
    <div id="floating-hub-wrapper">
        <button class="hub-fab-btn" onclick="returnToHub()">
            <span>☰</span> Return to Hub
        </button>
        <button class="hub-fab-toggle" id="fabToggleBtn" onclick="toggleFabCollapse(event)">
            ✕
        </button>
    </div>

    <!-- ISOLATED SCRIPT CONTAINERS -->
    <iframe id="app-salvation" class="app-frame" allow="microphone; geolocation" src="https://jesus-nine-drab.vercel.app"></iframe>
    <iframe id="app-living-word" class="app-frame" allow="microphone" src="https://written-gamma.vercel.app"></iframe>
    <iframe id="app-kingdom-come" class="app-frame" allow="camera; microphone" src="https://ka-ten-rust.vercel.app"></iframe>
    <iframe id="app-reconciliation" class="app-frame" allow="microphone" src="https://reconcile-blond.vercel.app"></iframe>
    <iframe id="app-gods-generals" class="app-frame" allow="microphone" src="https://ochollah.github.io/Genaral"></iframe>
    <iframe id="app-bible-teaching" class="app-frame" allow="microphone" src="https://ochollah.github.io/Word"></iframe>
    <iframe id="app-sermon-editor" class="app-frame" allow="microphone" src="https://sermon-wheat.vercel.app"></iframe>

    <script>
        const menu = document.getElementById('circleMenu');
        const fabWrapper = document.getElementById('floating-hub-wrapper');
        const fabToggleBtn = document.getElementById('fabToggleBtn');

        function layoutNodes() {
            if (!menu) return;
            const nodes = menu.querySelectorAll('.app-node');
            const total = nodes.length;
            const radius = menu.offsetWidth / 2;

            nodes.forEach((node, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = radius + radius * Math.cos(angle);
                const y = radius + radius * Math.sin(angle);

                node.style.left = `${x}px`;
                node.style.top = `${y}px`;
            });
        }

        // TOUCH & HOVER CONTROLS FOR MENU ROTATION
        menu.addEventListener('touchstart', () => menu.classList.add('paused'), { passive: true });
        menu.addEventListener('touchend', () => setTimeout(() => menu.classList.remove('paused'), 1200), { passive: true });
        menu.addEventListener('mouseenter', () => menu.classList.add('paused'));
        menu.addEventListener('mouseleave', () => menu.classList.remove('paused'));

        // APP NODE LAUNCHERS
        document.querySelectorAll('.app-node').forEach(node => {
            const appId = node.getAttribute('data-app');

            node.addEventListener('touchstart', function() {
                this.classList.add('active-touch');
            }, { passive: true });

            node.addEventListener('touchend', function() {
                this.classList.remove('active-touch');
                launchApp(appId);
            });

            node.addEventListener('click', function() {
                launchApp(appId);
            });
        });

        function launchApp(appId) {
            document.getElementById('hub-container').classList.add('hidden');
            document.querySelectorAll('.app-frame').forEach(frame => frame.classList.remove('active'));
            const target = document.getElementById(appId);
            if (target) {
                target.classList.add('active');
                fabWrapper.classList.add('active');
            }
        }

        function returnToHub() {
            document.querySelectorAll('.app-frame').forEach(frame => frame.classList.remove('active'));
            document.getElementById('hub-container').classList.remove('hidden');
            fabWrapper.classList.remove('active');
        }

        function toggleFabCollapse(e) {
            e.stopPropagation();
            fabWrapper.classList.toggle('collapsed');
            fabToggleBtn.textContent = fabWrapper.classList.contains('collapsed') ? '☰' : '✕';
        }

        // DRAGGABLE FLOATING HUB BUTTON LOGIC
        let isDragging = false;
        let currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

        fabWrapper.addEventListener("touchstart", dragStart, { passive: false });
        fabWrapper.addEventListener("touchend", dragEnd, { passive: false });
        fabWrapper.addEventListener("touchmove", drag, { passive: false });

        fabWrapper.addEventListener("mousedown", dragStart);
        document.addEventListener("mouseup", dragEnd);
        document.addEventListener("mousemove", drag);

        function dragStart(e) {
            if (e.target === fabToggleBtn) return;
            const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;

            initialX = clientX - xOffset;
            initialY = clientY - yOffset;
            isDragging = true;
        }

        function dragEnd() {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

                currentX = clientX - initialX;
                currentY = clientY - initialY;

                xOffset = currentX;
                yOffset = currentY;

                fabWrapper.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        }

        window.addEventListener('load', layoutNodes);
        window.addEventListener('resize', layoutNodes);
        window.addEventListener('orientationchange', () => setTimeout(layoutNodes, 200));
    </script>
</body>
</html>
